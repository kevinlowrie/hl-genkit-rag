# Dependabot version updates for this repository and its subdirectories.
# Security alerts and security updates are a separate repository setting.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/load-firestore-data"
    schedule:
      interval: "daily"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
