name: policy-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  policy-ci:
    name: policy-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint